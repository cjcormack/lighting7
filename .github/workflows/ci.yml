name: CI

# The PR gate: the backend, the frontend and the sidecar, on every pull request into main and on
# every push to main. This is where the full suites run — `./gradlew build` for the backend,
# `npm run check` in frontend/ and `go test` in link/; locally only the quick checks are
# expected (see "Pre-commit checks" in CLAUDE.md).
#
# No `paths:` filters, deliberately. A required status check whose workflow is skipped by a
# path filter never reports, and GitHub then blocks the PR waiting for it forever. Running
# both jobs on a docs-only PR costs minutes; a filter that wedges merges costs more.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the run in flight. Runs on main are never cancelled, so every
# merge commit gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    # Job names are what branch protection's "required status checks" match on — renaming
    # one silently un-requires it until the rule is updated to the new name.
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner's locale is POSIX, and compileTestKotlin then fails with an internal
      # compiler error writing class files named after test names that contain "—" (the same
      # trap scripts/cloud-session.sh exports this for).
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 24

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `check shadowJar`, not just `test`: `check` runs from the root, so it covers the
      # launcher's tests as well, and `shadowJar` assembles the fat jar, whose doLast verifier
      # fails on a wrong native payload (see "Building and Running" in CLAUDE.md). Not `build`:
      # that adds the dist zips and tars, which nothing here uses. `processResources` pulls in
      # buildFrontend, so this compiles the frontend too — with the Node version Gradle pins,
      # which is not necessarily the one the Frontend job uses. With the build cache on
      # (gradle.properties), a task whose inputs match main's last run is restored, not re-run.
      - name: Build and test
        run: ./gradlew check shadowJar --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/
            launcher/build/reports/tests/
            cloud-protocol/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  # lighting7-link, the WebRTC sidecar (link/, docs/cloud-engineering.md §"The sidecar"): vet,
  # format, its tests, a static build, and the licence gate over the modules that build links.
  # Go is the version link/go.mod names, and GOTOOLCHAIN=local keeps it from fetching another.
  link:
    name: Link
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: link

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: link/go.mod
          cache-dependency-path: link/go.sum

      - name: Tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o lighting7-link ./cmd/lighting7-link

      # The modules the binary links, not go.sum's, which also lists test-only and unlinked ones.
      - name: Licences
        run: |
          go version -m lighting7-link > go-modules.txt
          node ../scripts/licences.mjs --check --go-binary-modules go-modules.txt

  # `npm run check`, split: build and lint in one job, Vitest in three shards, all in parallel.
  frontend-build-lint:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint takes minutes cold, mostly `import/no-cycle` walking the import graph. PRs restore
      # the cache main last saved; main lints from scratch and saves. `npm run lint` keys entries
      # on file content, so a fresh checkout's mtimes don't invalidate them. A cached file can
      # keep a stale cross-file result, but a new cycle always closes on an edited (re-linted)
      # file, and main's uncached run is the backstop. tsconfig is in the key because its path
      # aliases decide what an import resolves to.
      - name: Restore ESLint cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: frontend/node_modules/.cache/eslint/
          key: eslint-${{ hashFiles('frontend/package-lock.json', 'frontend/eslint.config.*', 'frontend/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('frontend/package-lock.json', 'frontend/eslint.config.*', 'frontend/tsconfig*.json') }}-

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Save ESLint cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: frontend/node_modules/.cache/eslint/
          key: eslint-${{ hashFiles('frontend/package-lock.json', 'frontend/eslint.config.*', 'frontend/tsconfig*.json') }}-${{ github.sha }}

      # The licence gate's npm half and the notices (docs/licensing.md); Gradle's `check` runs the
      # same script for the JVM classpaths in the Backend job. After the cache save, so a licence
      # failure on main does not cost the next PRs their ESLint cache.
      - name: Licences
        run: npm run licences

  frontend-test:
    name: Frontend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx vitest run --shard=${{ matrix.shard }}/3

  # The required check. Branch protection matches on this name, so the split above stays
  # invisible to it. `always()` matters: without it a failed shard skips this job, and GitHub
  # counts a skipped required check as passing.
  frontend:
    name: Frontend
    needs: [frontend-build-lint, frontend-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every frontend job to pass
        run: |
          test "${{ needs.frontend-build-lint.result }}" = success
          test "${{ needs.frontend-test.result }}" = success
