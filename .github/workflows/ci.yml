name: CI

# The PR gate: both halves of the repo, on every pull request into main and on every push to
# main. This is where the full suites run — `./gradlew build` for the backend and
# `npm run check` in frontend/; locally only the quick checks are expected (see "Pre-commit
# checks" in CLAUDE.md).
#
# No `paths:` filters, deliberately. A required status check whose workflow is skipped by a
# path filter never reports, and GitHub then blocks the PR waiting for it forever. Running
# both jobs on a docs-only PR costs minutes; a filter that wedges merges costs more.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the run in flight. Runs on main are never cancelled, so every
# merge commit gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    # Job names are what branch protection's "required status checks" match on — renaming
    # one silently un-requires it until the rule is updated to the new name.
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner's locale is POSIX, and compileTestKotlin then fails with an internal
      # compiler error writing class files named after test names that contain "—" (the same
      # trap scripts/cloud-session.sh exports this for).
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 24

      - name: Set up Gradle
        # Held at v5 deliberately: v6 moved the caching into a proprietary component, and taking
        # it means accepting Gradle's Terms of Use — an owner's decision, not a Dependabot merge.
        uses: gradle/actions/setup-gradle@v6

      # `check shadowJar`, not just `test`: `check` runs from the root, so it covers the
      # launcher's tests as well, and `shadowJar` assembles the fat jar, whose doLast verifier
      # fails on a wrong native payload (see "Building and Running" in CLAUDE.md). Not `build`:
      # that adds the dist zips and tars, which nothing here uses. `processResources` pulls in
      # buildFrontend, so this compiles the frontend too — with the Node version Gradle pins,
      # which is not necessarily the one the Frontend job uses. With the build cache on
      # (gradle.properties), a task whose inputs match main's last run is restored, not re-run.
      - name: Build and test
        run: ./gradlew check shadowJar --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/
            launcher/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  # `npm run check`, split: build and lint in one job, Vitest in three shards, all in parallel.
  frontend-build-lint:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint takes minutes cold, mostly `import/no-cycle` walking the import graph. PRs restore
      # the cache main last saved; main lints from scratch and saves. `npm run lint` keys entries
      # on file content, so a fresh checkout's mtimes don't invalidate them. A cached file can
      # keep a stale cross-file result, but a new cycle always closes on an edited (re-linted)
      # file, and main's uncached run is the backstop. tsconfig is in the key because its path
      # aliases decide what an import resolves to.
      - name: Restore ESLint cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: frontend/node_modules/.cache/eslint/
          key: eslint-${{ hashFiles('frontend/package-lock.json', 'frontend/eslint.config.*', 'frontend/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('frontend/package-lock.json', 'frontend/eslint.config.*', 'frontend/tsconfig*.json') }}-

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Save ESLint cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: frontend/node_modules/.cache/eslint/
          key: eslint-${{ hashFiles('frontend/package-lock.json', 'frontend/eslint.config.*', 'frontend/tsconfig*.json') }}-${{ github.sha }}

  frontend-test:
    name: Frontend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx vitest run --shard=${{ matrix.shard }}/3

  # The required check. Branch protection matches on this name, so the split above stays
  # invisible to it. `always()` matters: without it a failed shard skips this job, and GitHub
  # counts a skipped required check as passing.
  frontend:
    name: Frontend
    needs: [frontend-build-lint, frontend-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every frontend job to pass
        run: |
          test "${{ needs.frontend-build-lint.result }}" = success
          test "${{ needs.frontend-test.result }}" = success
