# Only what the desk's root gradle.properties cannot reach: these are read per build, so a
# standalone build of this directory (the cloud's) would otherwise lose them. Versions are not
# here; they are read from ../gradle.properties.
kotlin.code.style=official
org.gradle.warning.mode=fail
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.caching=true
