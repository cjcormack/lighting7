<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette on the programmer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 760px; height: 660px; box-sizing: border-box; padding: 40px 60px; background: #060608; color: #fafafa; font-family: Inter, system-ui, sans-serif; font-size: 12px">
  <div role="dialog" aria-label="Command palette" style="width: 640px; height: 580px; display: flex; flex-direction: column; background: #1c1c21; border: 1px solid #34343a; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); overflow: hidden">

    <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #2a2a30">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <sc-if value="{{onSub}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{back}}" aria-label="Back" style="height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border: 0; border-radius: 5px; background: #3f3f46; color: #fafafa; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          {{subTitle}}
        </button>
      </sc-if>
      <input type="text" aria-label="Command" placeholder="{{placeholder}}" value="{{q}}" onChange="{{onQ}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fafafa; font: inherit; font-size: 14px">
      <kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; border: 1px solid #3f3f46; border-radius: 4px; padding: 1px 5px; color: #a1a1aa">esc</kbd>
    </div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="padding: 8px 10px 4px; display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #a1a1aa">{{g.heading}}</span>
          <span style="font-size: 11px; color: #8b8b94">{{g.note}}</span>
        </div>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="5">
          <button type="button" onClick="{{it.run}}" style="width: 100%; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 6px; background: {{it.bg}}; color: {{it.fg}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer">
            <span style="width: 8px; height: 8px; border-radius: 4px; background: {{it.dot}}; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.2)"></span>
            <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.label}}</span>
            <sc-if value="{{it.isNew}}" hint-placeholder-val="{{ false }}"><span style="font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: #0f0f12; background: #fbbf24; border-radius: 3px; padding: 1px 4px">NEW</span></sc-if>
            <span style="font-size: 11.5px; color: #a1a1aa; white-space: nowrap">{{it.hint}}</span>
            <sc-if value="{{it.hasKey}}" hint-placeholder-val="{{ false }}"><kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; border: 1px solid #3f3f46; border-radius: 4px; padding: 0 5px; color: #a1a1aa">{{it.key}}</kbd></sc-if>
            <sc-if value="{{it.hasSub}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></sc-if>
          </button>
        </sc-for>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 40px 0; text-align: center; color: #a1a1aa; font-size: 13px">No command matches “{{q}}”.</div>
      </sc-if>
    </div>

    <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-top: 1px solid #2a2a30; font-size: 11px; color: #a1a1aa">
      <span>{{footer}}</span>
      <span style="flex: 1"></span>
      <span>{{ran}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":660}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', page: 'root', ran: '' };
  }
  renderVals() {
    const { q, page } = this.state;
    const ran = (label) => () => this.setState({ ran: 'Ran: ' + label });
    const go = (p) => () => this.setState({ page: p, q: '' });
    const it = (label, hint, opts) => Object.assign({ label, hint, isNew: true, key: '', sub: null, dot: '#3f3f46', dim: false }, opts || {});

    const roots = [
      { heading: 'Programmer', note: 'Q4 Warm wash · 6 values, 2 layers', items: [
        it('Add a Look…', 'lands whole', { sub: 'look' }),
        it('Include a cue or Look…', 'replaces the source'),
        it('Record…', '6 values, 2 layers'),
        it('Record into Q4 Warm wash', 'the cue you are editing'),
        it('Record a new Look…', ''),
        it('New palette from the selection…', '6 cells'),
        it('Update Q4 Warm wash', 'writes the edits back'),
        it('Revert to Q4', 'clear, then include again'),
        it('Clear the programmer', 'over 1s'),
        it('Blind on', 'over 1s'),
        it('Programmer fade: Snap · 0.5s · 1s · 2s · 3s', 'now 1s'),
        it('Show the Stack table', '2 layers'),
        it('Show the FX table', '3 running'),
        it('Show Output', 'scope'),
        it('Show Local', 'scope')
      ]},
      { heading: 'Selection', note: '6 heads · 6 cells · following the desk', items: [
        it('Set the selected cells', '6 cells', { key: '⏎' }),
        it('Apply a palette…', '6 heads · Colour', { sub: 'palette' }),
        it('Add FX on the selection…', '6 heads · Replace or Stack', { isNew: false }),
        it('Fan across the selection…', ''),
        it('Release the selected cells', '6 cells', { key: '⌫' }),
        it('Release the whole heads', 'values and Local FX'),
        it('Narrow: all', 'rig order'),
        it('Narrow: odd', 'rig order'),
        it('Narrow: even', 'rig order'),
        it('Narrow: 1st half', 'rig order'),
        it('Narrow: 2nd half', 'rig order'),
        it('Invert the selection', 'rig order'),
        it('Next head', 'rig order'),
        it('Previous head', 'rig order'),
        it('Mask: All · Intensity · Colour · Position · Beam', 'now Colour'),
        it('Locate the selection', 'white beam at centre'),
        it('Set locate from current', 'stored on the patch'),
        it('Highlight the selection', ''),
        it('Stop following the desk selection', 'this window keeps its own'),
        it('Deselect', '')
      ]}
    ];
    const pal = (name, color, on, dim) => it(name, on ? 'on' : '', { isNew: false, dot: color, dim });
    const subs = {
      palette: [
        { heading: 'Fits the selection', note: '6 heads · Colour', items: [
          pal('Amber wash', '#f59e0b', true), pal('CT blue', '#5b8def'), pal('Congo', '#4b2a9e'),
          pal('Lavender', '#b4a0e5'), pal('Deep red', '#b91c1c'), pal('Open white', '#f5f5f4'), pal('Moss', '#4d7c0f')
        ]},
        { heading: 'Outside the Colour mask', note: 'refused under this mask — change the mask first', items: [
          pal('Full', '#e4e4e7', false, true), pal('Half', '#a1a1aa', false, true),
          pal('Centre stage', '#71717a', false, true), pal('Gobo 3 + prism', '#71717a', false, true)
        ]}
      ],
      look: [
        { heading: 'Looks', note: 'a Look lands whole: no selection, no mask', items: [
          it('Front warm', '12 fixtures · on', { isNew: false }), it('Cold side', '8 fixtures', { isNew: false }),
          it('Ballyhoo', '4 movers · FX', { isNew: false }), it('Finale', '24 fixtures', { isNew: false })
        ]}
      ]
    };

    const source = page === 'root' ? roots : subs[page];
    const needle = q.trim().toLowerCase();
    let first = true;
    const groups = source.map((g) => {
      const items = g.items
        .filter((x) => needle === '' || x.label.toLowerCase().includes(needle) || x.hint.toLowerCase().includes(needle) || g.heading.toLowerCase().includes(needle))
        .map((x) => {
          const active = first; first = false;
          return {
            label: x.label, hint: x.hint, isNew: x.isNew && page === 'root',
            key: x.key, hasKey: x.key !== '', hasSub: x.sub != null,
            dot: x.dot,
            bg: active ? '#2e2e35' : 'transparent',
            fg: x.dim ? '#8b8b94' : '#fafafa',
            run: x.sub ? go(x.sub) : ran(x.label)
          };
        });
      return { heading: g.heading, note: g.note, items };
    }).filter((g) => g.items.length > 0);

    return {
      q, groups, empty: groups.length === 0,
      onQ: (e) => this.setState({ q: e.target.value }),
      onSub: page !== 'root',
      subTitle: page === 'palette' ? 'Apply a palette' : 'Add a Look',
      back: go('root'),
      placeholder: page === 'root' ? 'Type a command — try “odd”, “record”, “blind”' : 'Search',
      footer: page === 'palette' ? '⏎ press as a layer · ⌥⏎ as values' : '↑↓ move · ⏎ run · NEW = not in ⌘K today',
      ran: this.state.ran
    };
  }
}
</script>
</body>
</html>
