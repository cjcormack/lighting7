<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commemoration Hall stage</title>
<style>
/* Layout: the desk's Stage route — header row, a 3D canvas, and the side sheet on the right
   (Positions · Scene · Notes). Dark only, in the desk's own OKLch vocabulary. */
:root {
  --bg: oklch(0.141 0.005 285.823);
  --card: oklch(0.21 0.006 285.885);
  --muted: oklch(0.274 0.006 286.033);
  --fg: oklch(0.985 0 0);
  --mfg: oklch(0.705 0.015 286.067);
  --bd: oklch(0.274 0.006 286.033);
  --pri: oklch(0.623 0.214 259.815);
  --amber: oklch(0.82 0.16 80);
  --canvas: #0b0e14;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.bar { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 16px; border-bottom: 1px solid var(--bd); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand b { font-size: 14px; }
.brand span { color: var(--mfg); font-size: 12px; }
.views { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.seg { display: inline-flex; gap: 2px; border: 1px solid var(--bd); background: var(--card); border-radius: 8px; padding: 2px; flex: 0 0 auto; }
.seg button { border: 0; background: none; height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--mfg); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--muted); color: var(--fg); }
.seg button.pick[aria-pressed="true"] { background: oklch(0.623 0.214 259.815 / 0.25); color: oklch(0.85 0.1 255); }
.barR { display: flex; align-items: center; gap: 6px; color: var(--mfg); font-size: 12px; }
select { background: var(--card); border: 1px solid var(--bd); border-radius: 6px; height: 26px; padding: 0 6px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.stage { position: relative; min-height: 0; overflow: hidden; background: var(--canvas); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; background: oklch(0.141 0.005 285.823 / 0.82); border: 1px solid oklch(0.4 0.01 286 / 0.5); color: var(--fg); will-change: transform; }
.lbl.pos { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--amber); border-color: oklch(0.82 0.16 80 / 0.4); }
.lbl.sel { border-color: var(--pri); background: oklch(0.3 0.09 260 / 0.9); }
.cap { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--mfg); pointer-events: none; }
.cap b { color: var(--fg); font-weight: 600; }
.stats { position: absolute; right: 12px; top: 10px; display: flex; gap: 10px; align-items: center; font: 11px var(--mono); color: var(--mfg); font-variant-numeric: tabular-nums; }
.stats button { border: 1px solid var(--bd); background: var(--card); border-radius: 6px; padding: 1px 7px; font-family: var(--sans); font-size: 11px; color: var(--mfg); }
.dock { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; right: 12px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.haze { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mfg); background: var(--card); border: 1px solid var(--bd); border-radius: 8px; padding: 3px 8px; }
.haze input { width: 90px; accent-color: var(--pri); }
.selbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 54px; display: flex; gap: 10px; align-items: center; background: oklch(0.21 0.006 285.885 / 0.94); border: 1px solid var(--bd); border-radius: 10px; padding: 6px 8px 6px 12px; font-size: 12px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; }
.selbar b { font-weight: 600; }
.selbar .m { color: var(--mfg); }
.selbar button { border: 1px solid var(--bd); background: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 11px; }
.focus { position: absolute; right: 12px; bottom: 54px; width: 300px; max-width: calc(100% - 24px); max-height: calc(100% - 110px); overflow-y: auto; background: oklch(0.21 0.006 285.885 / 0.96); border: 1px solid var(--bd); border-radius: 10px; padding: 10px 12px; font-size: 12px; display: grid; gap: 8px; }
.focus .fh { display: flex; align-items: center; gap: 8px; }
.focus .fh b { font-size: 13px; }
.focus .fh button { margin-left: auto; border: 0; background: none; color: var(--mfg); font-size: 16px; }
.focus svg { width: 132px; height: 132px; justify-self: center; }
.focus .frow { display: grid; grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; align-items: center; }
.focus .frow.one { grid-template-columns: 58px minmax(0, 1fr) 34px; }
.focus label { color: var(--mfg); font-size: 11px; }
.focus input[type=range] { width: 100%; accent-color: var(--amber); }
.focus .val { color: var(--mfg); font: 10px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.focus .note { color: var(--mfg); margin: 0; }
.focus .tabs2 { display: flex; gap: 4px; }
.focus .tabs2 button { border: 1px solid var(--bd); background: var(--card); border-radius: 6px; padding: 2px 8px; font-size: 11px; color: var(--mfg); }
.focus .tabs2 button[aria-pressed="true"] { color: var(--fg); border-color: var(--amber); }
.toast { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); max-width: calc(100% - 24px); background: oklch(0.21 0.006 285.885 / 0.96); border: 1px solid var(--amber); border-radius: 8px; padding: 6px 12px; font-size: 12px; }
.armchip { position: absolute; left: 12px; top: 34px; font: 700 11px var(--mono); letter-spacing: 0.08em; color: #fff; background: oklch(0.55 0.21 27); border-radius: 6px; padding: 3px 8px; }
.selbar button.danger { background: oklch(0.55 0.21 27); border-color: oklch(0.6 0.2 27); color: #fff; }
.selbar button:disabled { opacity: 0.45; }
.tip { position: absolute; pointer-events: none; background: oklch(0.21 0.006 285.885 / 0.96); border: 1px solid var(--bd); border-radius: 6px; padding: 4px 8px; font-size: 11px; white-space: nowrap; }
.tip .m { color: var(--mfg); }
.lost { position: absolute; inset: 0; display: grid; place-items: center; background: oklch(0.141 0.005 285.823 / 0.9); }
.lost > div { max-width: 320px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.lost p { margin: 0; color: var(--mfg); }
.lost button { border: 0; background: var(--pri); color: oklch(0.985 0 0); border-radius: 8px; padding: 6px 14px; font-weight: 600; }

.sheet { border-left: 1px solid var(--bd); display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--bg); }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--bd); }
.tabs button { border: 0; background: none; padding: 6px 10px 8px; font-size: 12px; font-weight: 600; color: var(--mfg); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--pri); }
.pane { overflow-y: auto; padding: 12px; min-height: 0; }
.eyebrow { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mfg); }
.hint { color: var(--mfg); font-size: 12px; margin: 0 0 10px; }

.prow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px solid var(--bd); align-items: start; }
.prow:first-of-type { border-top: 0; }
.prow .pn { font: 700 10px var(--mono); letter-spacing: 0.04em; color: var(--amber); padding-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pn small { display: block; font-weight: 400; color: var(--mfg); letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px 0 4px; border-radius: 6px; border: 1px solid var(--bd); background: var(--card); font-size: 11px; max-width: 100%; }
.chip .sw { width: 14px; height: 14px; border-radius: 3px; background: #2a2d33; box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.08); flex: 0 0 auto; }
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .lv { color: var(--mfg); font: 10px var(--mono); font-variant-numeric: tabular-nums; }
.chip .x2 { color: var(--mfg); font-size: 10px; }
.chip[aria-pressed="true"] { border-color: var(--pri); background: oklch(0.623 0.214 259.815 / 0.18); }
.stagefront { text-align: center; font: 700 9px var(--mono); letter-spacing: 0.2em; color: var(--mfg); padding: 4px 0; border-top: 1px dashed var(--bd); border-bottom: 1px dashed var(--bd); margin: 4px 0; }

.layers { display: grid; gap: 4px; margin-bottom: 12px; }
.layers label { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.layers input { accent-color: var(--pri); }
.el { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 8px; font-size: 12px; padding: 3px 0; align-items: baseline; }
.kind { font: 10px var(--mono); color: oklch(0.8 0.12 255); }
.dim { font: 10px var(--mono); color: var(--mfg); white-space: nowrap; }
.grp { margin: 14px 0 4px; }
pre { margin: 8px 0 0; padding: 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--bd); font: 11px/1.5 var(--mono); overflow-x: auto; color: oklch(0.88 0.02 286); }
.notes h3 { font-size: 12px; margin: 14px 0 4px; }
.notes h3:first-child { margin-top: 0; }
.notes p, .notes li { color: var(--mfg); margin: 0 0 6px; font-size: 12px; max-width: 62ch; }
.notes ul { padding-left: 18px; margin: 0; }
.notes b { color: var(--fg); font-weight: 600; }

@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
  .sheet { border-left: 0; border-top: 1px solid var(--bd); }
  .stats .hide-s { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><b>Stage</b><span>The Commemoration Hall · prototype</span></div>
    <nav class="views" id="views" aria-label="Viewpoints"></nav>
    <div class="barR"><label for="labels">Labels</label>
      <select id="labels"><option value="positions">Positions</option><option value="all">All fixtures</option><option value="none">None</option></select>
    </div>
  </header>
  <main class="main">
    <section class="stage" id="stage">
      <canvas id="c"></canvas>
      <div id="labelLayer" class="labels"></div>
      <div class="cap" id="cap"></div>
      <div class="stats" id="stats"></div>
      <div class="dock">
        <div class="seg" id="looks" role="group" aria-label="Cue list, Act 1"></div>
        <label class="haze" for="haze"><span>Haze</span><input id="haze" type="range" min="0" max="1" step="0.01" value="0.5"></label>
      </div>
      <div class="selbar" id="selbar" hidden></div>
      <div class="focus" id="focus" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>
      <div class="armchip" id="armchip" hidden></div>
      <div class="tip" id="tip" hidden></div>
      <div class="lost" id="lost" hidden><div><b>3D paused</b><p>The browser took the graphics context back to save memory. Everything else on the desk carries on.</p><button id="restore" type="button">Restore 3D</button></div></div>
    </section>
    <aside class="sheet">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-positions" aria-selected="true">Positions</button>
        <button type="button" role="tab" id="tab-scene" aria-selected="false">Scene</button>
        <button type="button" role="tab" id="tab-fixtures" aria-selected="false">Fixtures</button>
        <button type="button" role="tab" id="tab-notes" aria-selected="false">Notes</button>
      </div>
      <div class="pane" id="pane-positions"></div>
      <div class="pane" id="pane-scene" hidden></div>
      <div class="pane" id="pane-fixtures" hidden></div>
      <div class="pane notes" id="pane-notes" hidden></div>
    </aside>
  </main>
</div>

function specFor(type, kind, lanternId) {
  if (kind === 'STRIP') return { cls: 'strip', label: 'LED strip', family: 'Strip' }
  if (type === 'generic-dimmer') {
    const id = lanternId || LANTERN_FOR_KIND[kind] || 's4-26', l = LANTERNS[id]
    return { ...l, cls: 'static', lantern: id, label: l.name }
  }
  for (const [s, v] of TYPE_BODIES) if (type.includes(s)) return { cls: 'static', ...v, label: v.name }
  return { cls: 'static', beam: 20, field: 30, power: 30, label: 'Dimmer', family: 'Generic', body: { shape: 'par', len: 0.3, dia: 0.2, lensR: 0.08 } }
}
const staticDir = (yaw, pitch) => { const y = yaw * D2R, p = pitch * D2R
  return V(Math.sin(y) * Math.cos(p), -Math.cos(y) * Math.cos(p), -Math.sin(p)).normalize() }

// is stood on. A standing body is the hung one turned over — base down, yoke up — and a standing
// mover's rest beam points up, as `FixtureAim` already assumes for basePitchDeg 0.
const STAND_KINDS = new Set(['LEDGE', 'FLOOR_STAND'])
const P = RIG.map(([key, name, type, kind, rig, pos, yaw, pitch, , , length], i) => {

// The beam's cross-section, shared by surfaces and haze. uv is 1 at the field edge. A blade at angle a
// with depth d keeps the side of the line dot(uv, n) = 1 − d nearest the axis; iris shrinks the
// circle; soft is the focus, from a hard profile edge (0) to a wash's feathered one (1).
const BEAM_MASK = `
float beamMask(vec2 uv, vec4 shutD, vec4 shutA, float iris, float soft) {
  float r = length(uv), w = mix(0.025, 0.4, soft);
  float m = 1.0 - smoothstep(1.0 - w, 1.0, r);
  m *= 1.0 - smoothstep(iris - w * 0.6, iris + 0.005, r);
  for (int b = 0; b < 4; b++) {
    float lim = 1.0 - shutD[b];
    float x = dot(uv, vec2(cos(shutA[b]), sin(shutA[b])));
    m *= 1.0 - smoothstep(lim - w * 0.6, lim + 0.005, x);
  }
  return m;
}`
const RECV_VS = `
varying vec3 vW; varying vec3 vN;
#ifdef USE_INSTANCING_COLOR
varying vec3 vIC;
#endif
void main() {
  mat4 m = modelMatrix;
  #ifdef USE_INSTANCING
  m = m * instanceMatrix;
  #endif
  vec4 w = m * vec4(position, 1.0);
  vW = w.xyz; vN = normalize(mat3(m) * normal);
  #ifdef USE_INSTANCING_COLOR
  vIC = instanceColor;
  #endif
  gl_Position = projectionMatrix * viewMatrix * w;
}`
const RECV_FS = `
uniform vec3 uAlbedo; uniform int uPattern; uniform float uAmbient; uniform float uFill; uniform int uCount;
uniform vec3 uLPos[MAXL]; uniform vec3 uLDir[MAXL]; uniform vec3 uLCol[MAXL]; uniform vec2 uLCone[MAXL]; uniform float uLRange[MAXL];
uniform vec3 uLRight[MAXL]; uniform vec4 uLShut[MAXL]; uniform vec4 uLShutA[MAXL]; uniform vec3 uLOpt[MAXL];
varying vec3 vW; varying vec3 vN;
#ifdef USE_INSTANCING_COLOR
varying vec3 vIC;
#endif
float h21(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
${BEAM_MASK}
float grid(vec2 q, vec2 cell, float w) {
  vec2 f = fract(q / cell); vec2 e = min(f, 1.0 - f) * cell;
  return smoothstep(w * 0.4, w, min(e.x, e.y));
}

  if (!ps.length) return
  if (focusIdx >= ps.length) focusIdx = 0
  const p = ps[focusIdx], sh = p.shape, b = p.s.body, generic = !!p.s.lantern
  const tabs = ps.length > 1 ? `<div class="tabs2">${ps.map((q, i) => `<button type="button" data-fi="${i}" aria-pressed="${i === focusIdx}">Lantern ${i + 1} · x ${q.pos[0].toFixed(1)} m</button>`).join('')}</div>` : ''
  let rows = ''
  const row = (id, label, v, min, max, step, show) => `<div class="frow one"><label for="${id}">${label}</label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${v}"><span class="val" id="${id}-v">${show(v)}</span></div>`
  if (generic && (b.shutters || b.barnDoors)) {
    const what = b.shutters ? 'Shutter' : 'Barn door'
    rows += `<p class="note">${what}s: depth, then angle. Named for the edge of the light they cut.</p>`
    rows += BLADES.map(([name], i) => `<div class="frow"><label>${name}</label><input id="fd${i}" type="range" min="0" max="0.9" step="0.01" value="${sh.d[i]}" aria-label="${name} ${what.toLowerCase()} depth"><input id="fa${i}" type="range" min="-30" max="30" step="1" value="${sh.a[i]}" aria-label="${name} ${what.toLowerCase()} angle"></div>`).join('')
    if (b.shutters) rows += row('frot', 'Rotate', sh.rot, -45, 45, 1, (v) => `${v}°`) + row('firis', 'Iris', sh.iris, 0.2, 1, 0.01, (v) => (v >= 1 ? 'open' : `${Math.round(v * 100)}%`))
  }
  if (generic) {
    rows += row('fsoft', 'Focus', sh.soft, 0, 1, 0.01, (v) => (v < 0.2 ? 'sharp' : v > 0.7 ? 'soft' : 'medium'))
    if (p.s.zoom) rows += row('fzoom', 'Zoom', sh.zoom ?? p.s.field, p.s.zoom[0], p.s.zoom[1], 1, (v) => `${v}°`)
  } else {
    rows += `<p class="note">${p.s.label}: zoom, focus${p.type.includes('source4-revolution') ? ', iris' : ''} come from its channels, so the look drives them. ${p.body.cells.length > 1 ? `${p.body.cells.length} cells, each with its own beam.` : ''}</p>`
  }
  focusEl.innerHTML = `<div class="fh"><b>Focus</b><span class="val">${p.name}</span><button type="button" aria-label="Close focus">×</button></div>${tabs}<div id="fprev">${bladePreview(sh, generic ? null : p.cur.iris ?? 1)}</div>${rows}`
  focusEl.hidden = false
  focusEl.querySelector('.fh button').onclick = () => { focusEl.hidden = true }
  focusEl.querySelectorAll('[data-fi]').forEach((btn) => btn.addEventListener('click', () => { focusIdx = +btn.dataset.fi; openFocus(key) }))
  const refresh = () => { focusEl.querySelector('#fprev').innerHTML = bladePreview(sh, generic ? null : p.cur.iris ?? 1) }
  const bind = (id, fn, show) => { const el = focusEl.querySelector('#' + id); if (!el) return
    el.addEventListener('input', () => { fn(+el.value); const v = focusEl.querySelector('#' + id + '-v'); if (v && show) v.textContent = show(+el.value); refresh() }) }
  BLADES.forEach((_, i) => { bind('fd' + i, (v) => { sh.d[i] = v }); bind('fa' + i, (v) => { sh.a[i] = v }) })
  bind('frot', (v) => { sh.rot = v }, (v) => `${v}°`)
  bind('firis', (v) => { sh.iris = v }, (v) => (v >= 1 ? 'open' : `${Math.round(v * 100)}%`))
  bind('fsoft', (v) => { sh.soft = v }, (v) => (v < 0.2 ? 'sharp' : v > 0.7 ? 'soft' : 'medium'))
  bind('fzoom', (v) => { sh.zoom = v }, (v) => `${v}°`)
}

// ─── Positions sheet: the 2D surface, derived from riggings and x, never a stored layout ─────
function buildPositions() {
  const pane = document.getElementById('pane-positions')
  const rows = new Map()
  for (const p of P) {
    const r = p.rig === 'Proscenium' ? 'Pros' : p.rig || (p.key.startsWith('house') ? 'House' : 'Other')
    if (!rows.has(r)) rows.set(r, { name: r, ys: [], keys: new Map() })
    const row = rows.get(r); row.ys.push(p.pos[1])
    if (!row.keys.has(p.key)) row.keys.set(p.key, { key: p.key, p, n: 0, minX: Infinity })
    const k = row.keys.get(p.key); k.n++; k.minX = Math.min(k.minX, p.pos[0])
  }
  const list = [...rows.values()].map((r) => ({ ...r, y: r.ys.reduce((a, b) => a + b, 0) / r.ys.length })).sort((a, b) => b.y - a.y)
  let html = '<p class="hint">Every position from upstage to the back of the hall; units in rig order as you see them from the desk. Tap one to select it here and in 3D.</p>'
  let frontDrawn = false
  for (const r of list) {
    if (!frontDrawn && r.y < 0.2) { html += '<div class="stagefront">STAGE EDGE</div>'; frontDrawn = true }
    const chips = [...r.keys.values()].sort((a, b) => a.minX - b.minX).map((k) =>
      `<button type="button" class="chip" data-key="${k.key}" aria-pressed="false"><span class="sw"></span><span class="nm">${shortName(k.p)}</span>${k.n > 1 ? `<span class="x2">×${k.n}</span>` : ''}<span class="lv"></span></button>`).join('')
    html += `<div class="prow"><div class="pn">${r.name}<small>${r.y.toFixed(1)} m</small></div><div class="chips">${chips}</div></div>`
  }
  pane.innerHTML = html
  pane.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => { select(selectedKey === c.dataset.key ? null : c.dataset.key); if (selectedKey) frameSelection() }))
}
function updateChips() {
  document.querySelectorAll('.chip').forEach((c) => {
    const p = P.find((q) => q.key === c.dataset.key)
    c.querySelector('.sw').style.background = `#${displayCol(p).getHexString()}`
    c.querySelector('.lv').textContent = p.cur.level > 0.005 ? `${Math.round(p.cur.level * 100)}` : ''
  })
}

// ─── Scene tab: the document, layer toggles, and the MCP call that wrote it ──────────────────
const layerState = { venue: true, set: true, seating: true, rigging: true }
function applyLayerVisibility() { for (const k in layers) layers[k].visible = layerState[k]; setVisible = layerState.set }
function toggleLayer(k, on) { layerState[k] = on; applyLayerVisibility(); const cb = document.getElementById(`layer-${k}`); if (cb) cb.checked = on }
function buildScenePane() {
  const pane = document.getElementById('pane-scene')
  const row = (el) => `<div class="el"><span class="kind">${el.kind}</span><span>${el.name}</span><span class="dim">${el.kind === 'seating' ? `${el.params.rows}×${el.params.seatsPerRow}` : `${el.widthM}×${el.depthM ?? '–'}×${el.heightM}`}</span></div>`
  const venue = SCENE.filter((e) => e.layer === 'venue'), set = SCENE.filter((e) => e.layer === 'set')
  const sample = { name: 'Proscenium', kind: 'proscenium', layer: 'venue', x: 0, y: 0.35, z: -0.95, widthM: 8.6, depthM: 0.3, heightM: 5.55,
    finish: { colour: '#6a5d52', pattern: 'panels' }, params: { openingWidthM: 5.1, openingHeightM: 2.9, openingSillM: 0.95, surroundM: 0.18 } }
  pane.innerHTML = `
    <p class="hint">The venue as a document of named, parametric elements. Claude writes it with one <code>set_scene</code> call; you adjust it in Edit.</p>
    <div class="layers">
      <label><input type="checkbox" id="layer-venue" checked> Venue architecture · ${venue.length}</label>
      <label><input type="checkbox" id="layer-set" checked> Set for this production · ${set.length}</label>
      <label><input type="checkbox" id="layer-seating" checked> Seating · ${SEATS.length} seats</label>
      <label><input type="checkbox" id="layer-rigging" checked> Rigging · ${RIGGINGS.length}</label>
    </div>
    <div class="eyebrow grp">Venue</div>${venue.map(row).join('')}
    <div class="eyebrow grp">Set</div>${set.map(row).join('')}
    <div class="eyebrow grp">Scenery on the cues of Act 1</div>
    ${CUES.map((c) => `<div class="el"><span class="kind">Q${c.num}</span><span>${c.name}<br><span class="dim">${Object.entries(c.scenery).map(([el, st]) => `${el}: ${Object.entries(st).map(([k, v]) => `${k} ${v}`).join(', ')}${c.times && c.times[el] ? ` in ${c.times[el] / 1000} s` : ''}`).join(' · ') || 'no change, the set tracks'}${(c.events || []).map((ev) => ` · fires ${ev.fire[0]} tube ${'AB'[ev.fire[1]]} at +${ev.atMs / 1000} s, if armed`).join('')}</span></span><span></span></div>`).join('')}
    <div class="eyebrow grp">One element, as the tool takes it</div>
    <pre>${JSON.stringify({ tool: 'set_scene', elements: [sample] }, null, 2)}</pre>`
  for (const k of Object.keys(layerState)) document.getElementById(`layer-${k}`).addEventListener('change', (e) => toggleLayer(k, e.target.checked))
}
function buildFixturesPane() {
  const used = new Map()
  for (const p of beamP) { const k = p.s.lantern || p.s.name || p.s.label; if (!used.has(k)) used.set(k, new Set()); used.get(k).add(p.key) }
  const feat = (b) => [b.shutters && 'shutters', b.barnDoors && 'barn doors', b.frame && 'colour frame', b.head && `${b.head} head`, b.cells && `${b.cells} cells`].filter(Boolean).join(' · ')
  const row = (id, l) => `<div class="el"><span class="kind">${l.family}</span><span>${l.name}<br><span class="dim">${l.zoom ? `zoom ${l.zoom.join('–')}°` : `${l.beam}° beam · ${l.field}° field`}${l.oval ? ` · oval ${l.oval.join('×')}°` : ''} · ${feat(l.body)}</span></span><span class="dim">${used.has(id) ? `${used.get(id).size} in rig` : ''}</span></div>`
  document.getElementById('pane-fixtures').innerHTML = `
    <p class="hint">A generic dimmer picks its lantern here, and so does each extra placement: a pair on one dimmer can be a profile and a fresnel. Select a dimmer on stage or in Positions to change it.</p>
    <div class="eyebrow grp">Lantern library</div>${Object.entries(LANTERNS).map(([id, l]) => row(id, l)).join('')}
    <div class="eyebrow grp">DMX fixture types in this rig</div>${TYPE_BODIES.map(([, v]) => row(v.name, v)).join('')}`
}
function buildNotes() {
  document.getElementById('pane-notes').innerHTML = `
    <h3>What this is</h3>
    <p>A throwaway prototype for the stage-view design record. The rig is project 15's real placements. The venue and the set are estimated from the FOH video, written as the proposed scene document (Scene tab).</p>
    <h3>Try</h3>
    <ul>
      <li><b>Balcony · desk</b> is the angle the video was shot from.</li>
      <li><b>Act 1</b> is a cue list with scenery on the cues. Q1 closes the house tabs, Q2 draws them over 4 s, Q3 flies the moon in over 6 s, and Q4 leaves both where they are, because scenery tracks. Jump to any cue and the set lands as if you had run the list.</li>
      <li>Select any conventional and pick its lantern from the library. Lenses stay dark glass until the dimmer is up.</li>
      <li>Select a lantern and press <b>Focus</b>. Profiles have four shutters (depth and angle), gate rotation and an iris; fresnels have barn doors; every conventional has sharp ↔ soft, and zoom where the lantern has one. The ADV2 fronts start shuttered off the pros.</li>
      <li>Select a <b>Twin Shot</b> (on ADV1, or standing on the balcony ledge): arm it, fire either tube, reload. <b>Q5 Curtain call</b> fires both cannons as cue events, but only if armed; otherwise it says it skipped them.</li>
      <li><b>Sit in a seat</b>, then click any seat in the stalls. Drag to look around; scroll to zoom.</li>
      <li><b>Plan</b>, <b>Front</b> and <b>Side</b> are cameras on the same scene, cut as sections.</li>
      <li><b>Positions</b> is the proposed 2D surface: rows by position, units in rig order, live colour and level.</li>
      <li><b>Test recovery</b> drops the WebGL context the way Safari does under memory pressure.</li>
    </ul>
    <h3>What it leaves out</h3>
    <p>Shadows (each beam stops at the first surface on its axis instead), gobos, oval PAR beams, the gel in the colour frame, zoom, pan/tilt limits, level of detail and editing. The desk's real beam optics would carry over; only the surface-lighting path changes.</p>`
}

// ─── Chrome ───────────────────────────────────────────────────────────────────────────────────
function setCaption(title, sub) { document.getElementById('cap').innerHTML = `<b>${title}</b> · ${sub}` }
{
  const nav = document.getElementById('views')
  const seg = (ids, extra = '') => `<div class="seg" role="group" ${extra}>${ids.map((id) => { const v = VIEWPOINTS.find((q) => q.id === id); return `<button type="button" data-vp="${id}" aria-pressed="false">${v.name}</button>` }).join('')}</div>`
  nav.innerHTML = seg(['orbit']) + seg(['desk', 'rowf', 'rowa1', 'actor'], 'id="seatSeg" aria-label="Saved viewpoints"')
    + seg(['plan', 'front', 'side'], 'aria-label="Sections"')
    + '<div class="seg"><button type="button" class="pick" id="pickSeat" aria-pressed="false">Sit in a seat…</button></div>'
  nav.querySelectorAll('button[data-vp]').forEach((b) => b.addEventListener('click', () => { setPicking(false); goTo(b.dataset.vp) }))
  document.getElementById('pickSeat').addEventListener('click', () => setPicking(!pickingSeat))
  const looks = document.getElementById('looks')
  looks.innerHTML = `<button type="button" disabled style="opacity:1;color:var(--mfg)">Act 1</button>` + CUES.map((c, i) => `<button type="button" data-cue="${i}" aria-pressed="false">${c.num} ${c.name}</button>`).join('')
    + `<button type="button" id="goBtn" style="color:var(--fg);background:var(--pri)">GO</button>`
  looks.querySelectorAll('button[data-cue]').forEach((b) => b.addEventListener('click', () => goCue(+b.dataset.cue)))
  document.getElementById('goBtn').addEventListener('click', () => goCue((activeCue + 1) % CUES.length))
  document.getElementById('haze').addEventListener('input', (e) => { beamMat.uniforms.uHaze.value = +e.target.value })
  document.getElementById('labels').addEventListener('change', (e) => { labelMode = e.target.value })
  const tabs = ['positions', 'scene', 'fixtures', 'notes']
  tabs.forEach((t) => document.getElementById(`tab-${t}`).addEventListener('click', () => tabs.forEach((u) => {
    document.getElementById(`tab-${u}`).setAttribute('aria-selected', String(u === t)); document.getElementById(`pane-${u}`).hidden = u !== t })))
  addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (pickingSeat) setPicking(false); else select(null) } })
}

// ─── Context loss: pause, say so, and come back — never a blank canvas ────────────────────────
let lost = false
const lostEl = document.getElementById('lost')
const loseExt = renderer.getContext().getExtension('WEBGL_lose_context')
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); lost = true; lostEl.hidden = false })
canvas.addEventListener('webglcontextrestored', () => { lost = false; lostEl.hidden = true })
document.getElementById('restore').addEventListener('click', () => { if (loseExt) loseExt.restoreContext(); else location.reload() })

// ─── Resize and loop ──────────────────────────────────────────────────────────────────────────
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight
  renderer.setSize(w, h, false); persp.aspect = w / Math.max(1, h); persp.updateProjectionMatrix(); fitOrtho()
}
new ResizeObserver(resize).observe(stageEl)
const statsEl = document.getElementById('stats')
statsEl.innerHTML = '<span id="st"></span><button type="button" id="testLoss" class="hide-s">Test recovery</button>'
document.getElementById('testLoss').addEventListener('click', () => loseExt && loseExt.loseContext())
let frames = 0, lastStat = performance.now(), active = 0, chipsAt = 0, lastNow = performance.now(), armShown = null
function loop(now) {
  requestAnimationFrame(loop)
  if (lost) return
  stepFade(now); stepTween(now)
  if (mode === 'orbit') orbit.update()
  else if (mode === 'ortho') orthoCtl.update()
  else if (mode === 'look') { persp.position.copy(look.eye); persp.lookAt(lookTarget()) }
  active = updateRig()
  stepConfetti(Math.min(0.05, (now - lastNow) / 1000), now); lastNow = now
  { const left = Math.max(0, Math.ceil((ARM.until - now) / 1000)), txt = left ? `ARMED · ${left}s` : ''
    if (txt !== armShown) { const el = document.getElementById('armchip'); el.textContent = txt; el.hidden = !left; armShown = txt; if (!left && selectedKey && P.find((q) => q.key === selectedKey)?.s.cls === 'cannon') select(selectedKey) } }
  renderer.render(scene, cam)
  updateLabels()
  if (now - chipsAt > 100) { updateChips(); chipsAt = now }
  frames++
  if (now - lastStat > 500) {
    const i = renderer.info.render
    document.getElementById('st').textContent = `${Math.round((frames * 1000) / (now - lastStat))} fps · ${i.calls} draws · ${(i.triangles / 1000).toFixed(0)}k tris · ${active} lights · DPR ${renderer.getPixelRatio().toFixed(2)}`
    frames = 0; lastStat = now
  }
}
buildPositions(); buildScenePane(); buildFixturesPane(); buildNotes(); applyLayerVisibility()
resize()
{ const h = location.hash.slice(1); goCue(1, true); goTo(VIEWPOINTS.some((v) => v.id === h) ? h : 'desk'); if (tween) tween.dur = 1 }
requestAnimationFrame(loop)
</script>
