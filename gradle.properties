# NOTE: there is deliberately no `ktor_version` here. Every io.ktor artifact is declared
# versionless in build.gradle.kts and resolved from io.ktor.plugin's BOM, so the single
# source of truth is the `id("io.ktor.plugin") version ...` literal there. A property here
# would be a silent no-op — editing it (e.g. for a security advisory) would change nothing
# while the build still went green.
kotlin_version=2.4.10
shadow_version=9.6.1
logback_version=1.6.1
kotlin.code.style=official
sqlite_version=3.53.2.1
exposed_version=1.3.1
hikaricp_version=7.1.0

# Raise Kotlin compile daemon heap — Kotlin 2.2.x + the FX DSL + test sources
# produce an IR tree large enough that the default 1 GB hits OOM on full
# recompiles (e.g. `--rerun-tasks`).
kotlin.daemon.jvmargs=-Xmx2g

# Warnings fail the build, so they can't creep back in. Three separate switches, because Gradle
# reports three separate kinds:
#  - `org.gradle.warning.mode=fail`: Gradle API deprecations, from this build or from a plugin
#    (the "Deprecated Gradle features were used in this build" footer). `fail` also prints each
#    one in full, as `--warning-mode all` would.
#  - `org.gradle.kotlin.dsl.allWarningsAsErrors`: Kotlin compiler warnings in the *.gradle.kts
#    scripts themselves (the `w:` lines under "> Configure project").
#  - The source sets' own Kotlin warnings are `compilerOptions.allWarningsAsErrors` in each
#    build.gradle.kts.
org.gradle.warning.mode=fail
org.gradle.kotlin.dsl.allWarningsAsErrors=true
