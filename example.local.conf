database {
    # SQLite database file. Empty string = use the default
    # `<appDataDir>/lighting7.db` (resolved per-OS by AppDataDir.kt). If you point this
    # outside the data dir, keep it unique per instance: the single-instance lock guards
    # the data dir, not the DB file, so two instances sharing one path still corrupt it.
    #
    # To relocate the *entire* data dir (DB, logs, caches, sync trees), set the
    # LIGHTING7_DATA_DIR env var or -Dlighting7.dataDir instead of a key here: the data
    # dir must be resolved before any config is read. This file is loaded from the process
    # working directory if present there, otherwise from the data dir. Only one instance
    # may use a data dir at a time (enforced via <appDataDir>/lighting7.lock at startup).
    path = ""
}

frontend {
    # Path to a built React `dist/` directory. Empty = serve the React bundle
    # baked into the JAR's classpath at /static/ (see Gradle copyFrontend task).
    staticPath = ""
}

dmx {
    # Mock output: every Art-Net universe composes, fades and draws as usual, but sends no packet
    # and binds no socket. For a development desk run in the venue, beside the desk driving the rig.
    # Default = false.
    mock = false
}

show {
    # Server-first boot. When true (default), the web server + UI + status
    # endpoint come up immediately and the show (FX compile, fixtures, cue
    # pre-warm, mDNS) initialises in the background; show-dependent endpoints
    # return 503 until ready and clients render a loading bar from
    # `GET /api/rest/status` / the `bootProgressState` WebSocket message.
    # Set to false for the legacy behaviour where the server refuses all
    # connections until the rig is fully live.
    backgroundInit = true
}

scriptCache {
    # Persist compiled Kotlin scripts (built-in FX effects, cue-trigger scripts,
    # user effects) to disk so they are only compiled from source on the first
    # boot after a rebuild — the largest single start-up cost. Cached jars are
    # keyed by script content + classpath fingerprint, so a rebuild invalidates
    # them automatically. Set to false to always compile from source.
    # Default = true.
    enabled = true

    # Directory for cached compiled-script jars. Empty = `<appDataDir>/script-cache`.
    path = ""
}

fx {
    # Compile the built-in FX effect scripts concurrently at start-up instead of
    # one at a time. Helps the first cold boot on multi-core machines (with the
    # disk cache, later boots load from jars and this barely matters). Set to
    # false to force sequential compilation. Default = true.
    parallelCompile = true
}

mdns {
    # Advertise the backend over Bonjour / DNS-SD so iPad and desktop clients
    # reach it at `lighting7-<hostname>.local:8413` without entering an IP.
    # Set to false to disable (e.g. on a machine with a non-mDNS network).
    enabled = true

    # Service name. Empty = derive from the local hostname (`lighting7-<host>`).
    # Override if you run multiple lighting7 instances on the same LAN.
    name = ""
}

sync {
    # Root for cloud-sync working trees. Each project gets its own per-UUID
    # repo at `<workingTreeRoot>/{projectUuid}/repo/`. Empty = `<appDataDir>/sync`.
    workingTreeRoot = ""

    # Where the desk keeps its secrets, such as its Lighting7 Cloud install key.
    # "keychain" uses the OS native keystore (macOS Security framework / libsecret /
    # Windows Credential Manager) via JNA. "file" falls back to an AES-GCM-encrypted
    # JSON blob under `<appDataDir>/credentials.enc`, encrypted with a key derived
    # from the install UUID + hostname. The file fallback is meant for headless
    # Linux installs that don't have libsecret available; on macOS / desktop Linux /
    # Windows, prefer "keychain".
    credentialStore = "keychain"
}

mcp {
    # The desk's public listener (docs/mcp-engineering.md): a second server that carries the
    # whole desk — UI, REST, WebSocket — to remote sessions through Lighting7 Cloud, which the
    # bundled sidecar forwards into it. Everything arriving on it is treated as remote (no password
    # sign-in, scripts, effects and fixture commands blocked unless allowed, closed while the desk has
    # no accounts). Claude reaches the desk through the cloud too (Install settings → Cloud).
    enabled = true
    host = "127.0.0.1"
    port = 8414
}

cloud {
    # Lighting7 Cloud (docs/cloud-engineering.md): the cloud this desk can be adopted by, from
    # Install settings → Cloud. https, or http only to a cloud on this machine. Absent =
    # https://lighting7.net; empty = no cloud.
    # baseUrl = ""
    # false turns the cloud off on this desk whatever the Cloud tab says: no adoption, no connection.
    enabled = true
    # Remote sessions' sidecar in place of the installed one (`./gradlew run` passes its own build).
    # Started with the cloud channel while Remote sessions is on.
    # link.binary = "link/lighting7-link"
    # The most channelState frames a second to a remote session's socket, the channels that changed
    # meanwhile merged; 0 sends every frame. The desk's own listener is never capped.
    # remote.channelStateHz = 20
}

sentry {
    # Errors and logs to Sentry (docs/observability-engineering.md). Whether this install reports
    # is an admin's choice in Install settings, stored on this machine: on by default for a dev
    # build, off for a release install until an admin turns it on. `enabled = false` here turns it
    # off whatever that choice says. The DSN and the rest default from application.conf.
    enabled = true

    # Fraction of transactions traced. Empty = 1.0, or 0.2 in the `release` environment.
    tracesSampleRate = ""

    # `development`, `release` or `cloud`. Empty = `release` for a release build, else `development`.
    environment = ""

    # Fraction of auto-sync runs that changed nothing kept as a trace; manual, failed and changed
    # runs are always kept. Empty = tracesSampleRate.
    idleSyncSampleRate = ""

    # The browser's session replay: the fraction of sessions recorded whole (empty = 0.1, or 0 in
    # the `release` environment), and of sessions that error (empty = 1.0).
    replaysSessionSampleRate = ""
    replaysOnErrorSampleRate = ""
}
