    <!-- Installable (multi-screen plan §3.6, D13): `display: fullscreen` with `standalone` as the
         fallback, so an installed desk screen launches chromeless with no gesture and no Esc trap,
         and an iPad's Add to Home Screen gets standalone. No service worker, deliberately: the desk
         is on the LAN and an offline shell would only show a page that cannot reach it. -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lighting" />
